apiVersion: 1
datasources:
  - name: fsmon-postgres
    uid: fsmon-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_ro
    isDefault: true
    jsonData:
      database: fsmon
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      timeInterval: 1d
    secureJsonData:
      password: grafana_ro
