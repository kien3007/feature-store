name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.11"
          enable-cache: true
      - name: Cài phụ thuộc (theo uv.lock)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check src tests scripts dags grafana feature_repo
          uv run ruff format --check src tests scripts grafana
      - name: Test
        run: uv run pytest
      - name: feast plan
        run: |
          mkdir -p data
          uv run feast -c feature_repo plan --skip-source-validation
      - name: Dashboard JSON khớp generator
        run: |
          uv run python grafana/build_dashboards.py
          git diff --exit-code grafana/provisioning/dashboards/json
